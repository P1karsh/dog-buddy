<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dog Gallery</title>
<style>
  body { margin: 0; padding: 20px; background: #fff8ee; font: 14px/1.4 ui-rounded, "Segoe UI", system-ui, sans-serif; color: #3b2a1a; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-end; margin-bottom: 18px; }
  .cell { background: #fff; border: 1px solid #f0e2cc; border-radius: 12px; padding: 8px 10px 6px; text-align: center; }
  .cell small { display: block; color: #8a7360; }
  .bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  button { font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid #e4cfae; background: #fff; cursor: pointer; }
  .dark { background: #1f1a17; }
</style>
</head>
<body>
<h1>Dog Buddy: dog gallery (dev only)</h1>
<div class="bar" id="bar"></div>
<div id="rows"></div>
<script src="../shared/dogs.js"></script>
<script>
  DogArt.adoptCss(document);
  const all = [];
  const variants = [['golden'], ['bernese'], ['lab', 'yellow'], ['lab', 'black'], ['lab', 'chocolate']];
  const states = [
    { label: 'sit', pose: 'sit', face: 'normal' },
    { label: 'stand', pose: 'stand', face: 'pant' },
    { label: 'sleep', pose: 'lie', face: 'sleep' },
    { label: 'happy', pose: 'sit', face: 'happy' },
    { label: 'walk', pose: 'stand', face: 'pant', walk: true },
  ];
  const rows = document.getElementById('rows');
  for (const [breed, coat] of variants) {
    const row = document.createElement('div');
    row.className = 'row';
    for (const s of states) {
      const d = DogArt.create(breed, coat);
      d.pose(s.pose); d.face(s.face); d.walking(!!s.walk);
      if (s.face === 'sleep') d.wag('none');
      d.el.style.width = d.size * 1.5 + 'px';
      const cell = document.createElement('div');
      cell.className = 'cell';
      const cap = document.createElement('small');
      cap.textContent = `${breed}${coat ? ' ' + coat : ''} · ${s.label}`;
      cell.append(d.el, cap);
      row.append(cell);
      all.push({ d, s });
    }
    rows.append(row);
  }
  const bar = document.getElementById('bar');
  for (const t of ['hop', 'twirl', 'bow', 'tilt', 'wiggle', 'boopPaw', 'boopNose', 'hearts']) {
    const b = document.createElement('button');
    b.textContent = t;
    b.onclick = () => all.forEach(({ d }) => (t === 'hearts' ? d.hearts() : d.trick(t)));
    bar.append(b);
  }
  const flip = document.createElement('button');
  flip.textContent = 'flip facing';
  flip.onclick = () => all.forEach(({ d }) => d.facing(d.isFacingLeft() ? 'right' : 'left'));
  const dark = document.createElement('button');
  dark.textContent = 'dark bg';
  dark.onclick = () => document.body.classList.toggle('dark');
  bar.append(flip, dark);
</script>
</body>
</html>
